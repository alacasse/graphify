# Cost controls: shorten retention to reduce stored artifact-days.
# Cost controls: lower compression from 9 if runner time matters more than storage.
name: Install sandbox complete

env:
  INSTALL_SANDBOX_ARTIFACT_RETENTION_DAYS: 14
  INSTALL_SANDBOX_ARTIFACT_COMPRESSION_LEVEL: 9

on:
  push:
    branches: ["v8", "main"]
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-sandbox-complete-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-sandbox-complete:
    name: Install sandbox complete
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TMPDIR: ${{ runner.temp }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install frozen dependencies
        run: uv sync --all-extras --frozen

      - name: Run the canonical complete gate
        run: uv run --frozen --python 3.12 python scripts/install_sandbox_quality.py complete

      - name: Upload install-sandbox evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graphify-install-sandbox-quality-*
          if-no-files-found: warn
          retention-days: ${{ env.INSTALL_SANDBOX_ARTIFACT_RETENTION_DAYS }}
          compression-level: ${{ env.INSTALL_SANDBOX_ARTIFACT_COMPRESSION_LEVEL }}

      - name: Write job summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          OUTPUT_ROOT: ${{ runner.temp }}
        run: |
          bundle_dir=""
          for candidate in "$OUTPUT_ROOT"/graphify-install-sandbox-quality-*; do
            if [[ -d "$candidate" ]]; then
              bundle_dir="$candidate"
              break
            fi
          done
          {
            echo "## Install-sandbox complete gate"
            echo
            if [[ -n "$ARTIFACT_URL" ]]; then
              echo "- [Download the complete diagnostic bundle]($ARTIFACT_URL)"
              echo
            fi
            if [[ -n "$bundle_dir" && -f "$bundle_dir/report.md" ]]; then
              cat "$bundle_dir/report.md"
            elif [[ -n "$bundle_dir" && -f "$bundle_dir/run.json" ]]; then
              echo "The behavioral report is unavailable. Host lifecycle metadata follows:"
              echo
              echo '```json'
              cat "$bundle_dir/run.json"
              echo
              echo '```'
            else
              echo "No report.md or run.json was produced. Read the complete-gate log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
