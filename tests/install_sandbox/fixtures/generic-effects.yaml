tool: synthetic
scopes:
  project:
  - effect_id: skill
    family: skill
    root: HOME
    path: .synthetic/skills/package
    source: package.md
    references: reference-data
  - effect_id: markdown-section
    family: markdown-section
    root: PROJECT
    path: GUIDE.md
    source: instructions.md
    marker: '## graphify'
  - effect_id: json-hooks
    family: json-hooks
    root: PROJECT
    path: .synthetic/config.json
    hooks:
    - id: PreToolUse-search
      event: PreToolUse
      matcher: Bash|Grep
      content:
        type: command
        command: graphify hook-guard search
        timeout: 10
    - id: PreToolUse-read
      event: PreToolUse
      matcher: Read|Glob
      content:
        type: command
        command: graphify hook-guard read
        timeout: 10
