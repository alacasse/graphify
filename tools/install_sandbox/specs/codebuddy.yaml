tool: codebuddy
scopes:
  project:
  - effect_id: skill
    family: skill
    root: HOME
    path: .codebuddy/skills/graphify
    source: skill.md
    references: skills/claude/references
  - effect_id: markdown-section
    family: markdown-section
    root: PROJECT
    path: CODEBUDDY.md
    source: always_on/claude-md.md
    marker: '## graphify'
  - effect_id: json-hooks
    family: json-hooks
    root: PROJECT
    path: .codebuddy/settings.json
    hooks:
    - id: PreToolUse-search
      event: PreToolUse
      matcher: Bash|Grep
      content:
        type: command
        command: graphify hook-guard search
        timeout: 10
    - id: PreToolUse-read
      event: PreToolUse
      matcher: Read|Glob
      content:
        type: command
        command: graphify hook-guard read
        timeout: 10
  user:
    state: unconstructible
    reason: User-scope expected effects have not been converted.
