    - root: home
      relative: .config/kilo/command/graphify.md
  project:
    install_command:
    - graphify
    - kilo
    - install
    uninstall_command:
    - graphify
    - kilo
    - uninstall
    expected:
    - root: home
      relative: .config/kilo/skills/graphify/SKILL.md
    - root: home
      relative: .config/kilo/command/graphify.md
