scopes: [user, project]
directory: .sandbox-reference

skill:
  lock: persistent
  file: skills/graphify/SKILL.md
  source: graphify/skill.md
  references: graphify/skills/claude/references

markdown:
  file: instructions.md
  marker: "## graphify"
  source: graphify/always_on/agents-md.md

json:
  file: settings.json
  list: instructions
  hook_management: registry
  hooks:
    - id: graphify.search
      event: PreToolUse
      matcher: Bash|Grep
      content:
        type: command
        command: graphify hook-guard search
