schema_version: 1

platform_order:
  - claude
  - codex
  - codebuddy
  - opencode
  - kilo
  - gemini
  - cursor
  - devin
  - aider
  - copilot
  - vscode
  - claw
  - droid
  - trae
  - trae-cn
  - hermes
  - kiro
  - pi
  - antigravity
  - antigravity-windows
  - windows
  - kimi
  - amp

platforms:
  claude:
    name: claude
    user_skill: .claude/skills/graphify/SKILL.md
    project_skill: .claude/skills/graphify/SKILL.md
    universal_uninstall_scopes: [project]
    scopes:
      user:
        uninstall_command: null
        risk_notes: [public_cli_lacks_user_skill_uninstall]
        expected:
          - kind: skill
            root: home
            relative: .claude/skills/graphify/SKILL.md
          - kind: text_section
            root: home
            relative: .claude/CLAUDE.md
            marker: "# graphify"
            preserve_user_content: true
            repair_stale_graphify_section: false
            remove_on_uninstall: false
      project:
        equivalent_install_command: [graphify, claude, install, --project]
        expected:
          - kind: skill
            root: project
            relative: .claude/skills/graphify/SKILL.md
          - kind: text_section
            root: project
            relative: .claude/CLAUDE.md
            marker: "# graphify"
            preserve_user_content: true
            repair_stale_graphify_section: false
          - kind: text_section
            root: project
            relative: CLAUDE.md
            preserve_user_content: true
          - kind: json_hooks
            root: project
            relative: .claude/settings.json
            schema_name: claude_settings
            hooks:
              - event: PreToolUse
                matcher: Bash
                detail_name: bash_hook_present
              - event: PreToolUse
                matcher: Read|Glob
                detail_name: read_glob_hook_present
  codex:
    name: codex
    user_skill: .codex/skills/graphify/SKILL.md
    project_skill: .codex/skills/graphify/SKILL.md
